<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울경찰 기동대 화장실 지도</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* 최상단 검색창 스타일 */
        #search-box {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            gap: 5px;
            width: 90%;
            max-width: 400px;
        }
        #searchInput { flex: 1; margin: 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        #search-box button { width: auto; background: #003478; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 0; }

        /* 플로팅 버튼 (위치 및 순서 재배치) */
        .btn-floating { position: fixed; z-index: 10; padding: 12px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer; border: none; font-weight: bold; }
        #btn-myloc { top: 75px; right: 20px; background: white; color: black; }
        #btn-admin { top: 130px; right: 20px; background: #003478; color: white; }
        #btn-logout { top: 185px; right: 20px; background: #555; color: white; display: none; }
        #btn-sync { top: 240px; right: 20px; background: #2e7d32; color: white; display: none; } 

        /* 모달 및 폼 공통 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20; }
        .modal-content { background: white; width: 90%; max-width: 400px; margin: 10% auto; padding: 20px; border-radius: 10px; max-height: 80vh; overflow-y: auto; }
        .close-btn { float: right; cursor: pointer; font-size: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .submit-btn { background: #003478; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* 화장실 상세 정보 및 이미지 팝업 */
        #imageZoomModal { z-index: 9999; background: rgba(0,0,0,0.8); cursor: pointer; display: none; align-items: center; justify-content: center; }
        #zoomImage { max-width: 95%; max-height: 95%; object-fit: contain; }
        .info-title { font-size: 18px; font-weight: bold; color: #003478; margin-bottom: 10px; }
        .info-workplace { font-size: 13px; color: #555; margin-bottom: 5px; font-weight: normal; }
        .info-row { margin-bottom: 5px; font-size: 14px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: white; margin-bottom: 10px;}
        .badge-police { background: #d32f2f; }
        .badge-public { background: #1976d2; }
        .image-carousel { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; }
        .image-carousel img { height: 150px; border-radius: 8px; flex-shrink: 0; object-fit: cover; cursor: pointer; }

        /* ★ 검색 마커 강조 (번쩍이는 효과) 애니메이션 */
        .pulse-marker {
            width: 70px; 
            height: 70px;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            border: 3px solid rgba(255, 0, 0, 0.8);
            animation: pulse 1s infinite ease-in-out;
            pointer-events: none; /* 클릭 방해 금지 */
        }
        @keyframes pulse {
            0% { transform: scale(0.1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }
    </style>
    <!-- 카카오맵 API (App Key 확인 요망) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f582c575c24af8ac06bccb60370ae130&libraries=services"></script>
</head>
<body>

    <div id="map"></div>
    
    <!-- 최상단 검색창 -->
    <div id="search-box">
        <input type="text" id="searchInput" placeholder="근무장소 또는 화장실 이름 검색" onkeypress="if(event.key === 'Enter' || event.keyCode === 13) searchToilet()">
        <button onclick="searchToilet()">검색</button>
    </div>

    <!-- 순서 재배치된 플로팅 버튼들 -->
    <button id="btn-myloc" class="btn-floating" onclick="moveToMyLocation()">내 위치 📍</button>
    <button id="btn-admin" class="btn-floating" onclick="document.getElementById('loginModal').style.display='block'">관리자 접속</button>
    <button id="btn-logout" class="btn-floating" onclick="logout()">로그아웃</button>
    <button id="btn-sync" class="btn-floating" onclick="fetchLiveData()">🔄 실시간 업데이트</button>

    <!-- 1. 로그인 모달 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('loginModal').style.display='none'">&times;</span>
            <h2 style="color:#003478; margin-top:0;">관리자 로그인</h2>
            <input type="text" id="adminId" placeholder="아이디">
            <input type="password" id="adminPw" placeholder="비밀번호">
            <button class="submit-btn" onclick="login()">로그인</button>
        </div>
    </div>

    <!-- 2. 화장실 등록 모달 -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('registerModal').style.display='none'">&times;</span>
            <h2 style="color:#003478; margin-top:0;">신규 화장실 등록</h2>
            <p style="font-size: 12px; color: #d32f2f; font-weight: bold;">※ 클릭하신 위치로 화장실이 등록됩니다.</p>
            
            <label style="font-size: 12px; font-weight:bold;">근무장소 (목록 선택 또는 직접 입력)</label>
            <input type="text" id="regWorkplace" list="workplaceList" placeholder="근무장소 (예: 광화문 광장)" autocomplete="off" required>
            <datalist id="workplaceList"></datalist>

            <label style="font-size: 12px; font-weight:bold; margin-top:10px; display:block;">화장실 이름</label>
            <input type="text" id="regName" placeholder="화장실 이름 (예: OO빌딩 1층)" required>
            
            <div style="display:flex; gap:5px; align-items:center; margin: 8px 0;">
                <input type="text" id="regAddress" placeholder="대략적인 주소" style="flex:1; margin:0;">
                <button type="button" onclick="fetchAddressFromMarker()" style="width:auto; padding:10px; background:#555; color:white; border:none; border-radius:5px; cursor:pointer; font-size:13px; white-space:nowrap; margin:0;">주소 가져오기</button>
            </div>

            <select id="regType">
                <option value="경찰전용/협조">경찰전용/협조 화장실</option>
                <option value="공공개방">일반 공공개방 화장실</option>
            </select>
            <input type="text" id="regPassword" placeholder="비밀번호 (없으면 공란)">
            <input type="text" id="regHours" placeholder="운영시간 (예: 24시간, 09:00~18:00)">
            <select id="regBidet">
                <option value="비데 모름/없음">비데 유무 선택</option>
                <option value="비데 있음">비데 있음</option>
                <option value="비데 없음">비데 없음</option>
            </select>
            <div style="display:flex; gap:10px;">
                <input type="number" id="regToilet" placeholder="대변기 수">
                <input type="number" id="regUrinal" placeholder="소변기 수">
            </div>
            
            <label style="font-size: 12px; margin-top:10px; display:block;">사진 첨부 1 (자동 압축)</label>
            <input type="file" id="regImage1" accept="image/*">
            
            <label style="font-size: 12px; margin-top:10px; display:block;">사진 첨부 2 (자동 압축)</label>
            <input type="file" id="regImage2" accept="image/*">
            
            <button class="submit-btn" style="margin-top:20px;" onclick="registerToilet()">등록하기</button>
        </div>
    </div>

    <!-- 3. 상세정보 모달 -->
    <div id="infoModal" class="modal">
        <div class="modal-content" id="infoContent"></div>
    </div>

    <!-- 4. 사진 확대 모달 -->
    <div id="imageZoomModal" class="modal" onclick="closeZoom()" style="display: none; align-items: center; justify-content: center;">
        <img id="zoomImage" src="" alt="확대된 사진">
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1bT0fmCcvCoHzWZ_zKAMU6Liiwd_KPuZbIWTDILO0kCsibH6byK4oNTvSFHvErSEXwg/exec'; 
        
        let map;
        let loggedInUser = null;
        let registerMarker = null; 
        let myLocMarker = null; // 내 위치 경찰관 마커
        let highlightOverlay = null; // 번쩍이는 검색 효과 오버레이
        let isRegisterMode = false;
        let geocoder; 
        let markers = []; 
        let allToiletsData = []; // 검색 기능을 위해 전체 데이터를 담을 배열

        const defaultWorkplaces = [
            "송파(올림픽공원)", "미국 대사관", "미국 대사관저", "일본 대사관", 
            "일본 대사관저", "중국 대사관", "중국 대사관저", "이스라엘 대사관", 
            "이스라엘 문화원", "이스라엘 대사관저", "파키스탄 대사관", 
            "정부종합청사", "민생치안 강남", "민생치안", "구로 평강교회", "여의도"
        ];

        window.onload = function() {
            let container = document.getElementById('map');
            let options = { center: new kakao.maps.LatLng(37.566826, 126.9786567), level: 4 }; 
            map = new kakao.maps.Map(container, options);
            geocoder = new kakao.maps.services.Geocoder();

            kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                if (isRegisterMode) {
                    let loc = mouseEvent.latLng;
                    if (!registerMarker) {
                        registerMarker = new kakao.maps.Marker({ map: map, position: loc, draggable: true });
                    } else {
                        registerMarker.setPosition(loc);
                        registerMarker.setMap(map);
                    }
                    document.getElementById('regAddress').value = '';
                    isRegisterMode = false;
                    document.getElementById('registerModal').style.display = 'block';
                }
            });

            moveToMyLocation();
            loadStaticToilets(); 
            checkLoginStatus(); 
        };

        // 내 위치 경찰관(👮) 마커 로직
        function moveToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let locPosition = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
                    map.setCenter(locPosition);
                    map.setLevel(4);

                    if(myLocMarker) { myLocMarker.setMap(null); }

                    let content = '<div style="font-size: 35px; background: white; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.4); border: 2px solid #003478; line-height:1;">👮</div>';
                    
                    myLocMarker = new kakao.maps.CustomOverlay({
                        map: map,
                        position: locPosition,
                        content: content,
                        yAnchor: 1 
                    });
                });
            } else {
                alert("GPS를 지원하지 않는 기기입니다.");
            }
        }

        async function loadStaticToilets() {
            try {
                let response = await fetch('./data/toilets.json');
                if (!response.ok) throw new Error("JSON 파일을 찾을 수 없습니다.");
                let result = await response.json();
                
                let dataArray = result.data ? result.data : result;
                allToiletsData = dataArray; 
                
                renderMarkers(dataArray);
            } catch(e) { 
                console.log("정적 데이터 로드 실패, 실시간 백업 API 호출:", e);
                fetchLiveData(); 
            }
        }

        async function fetchLiveData() {
            const syncBtn = document.getElementById('btn-sync');
            syncBtn.innerText = "⏳ 갱신 중...";
            try {
                let response = await fetch(SCRIPT_URL, { redirect: 'follow' });
                let result = await response.json();
                if(result.success) {
                    allToiletsData = result.data; 
                    renderMarkers(result.data);
                    alert("실시간으로 최신 데이터가 반영되었습니다.");
                }
            } catch(e) {
                alert("데이터를 갱신하는데 실패했습니다.");
                console.log(e);
            }
            syncBtn.innerText = "🔄 실시간 업데이트";
        }

        function renderMarkers(dataArray) {
            markers.forEach(m => m.setMap(null));
            markers = [];

            if(!dataArray || !Array.isArray(dataArray)) return;

            const fetchedWorkplaces = dataArray.map(t => t.workplace).filter(Boolean);
            const combinedWorkplaces = [...new Set([...defaultWorkplaces, ...fetchedWorkplaces])];
            const dataList = document.getElementById('workplaceList');
            dataList.innerHTML = combinedWorkplaces.map(wp => `<option value="${wp}">`).join('');

            dataArray.forEach(t => {
                // ★ 경찰 화장실 여부에 따른 테두리 색상 처리
                let isPolice = t.type && t.type.includes('경찰');
                let borderColor = isPolice ? '#d32f2f' : '#1976d2';

                // ★ 기존의 기본 마커 대신 화장실(🚻) 모양 이모지를 포함한 커스텀 HTML 요소 생성
                let content = document.createElement('div');
                content.style.cssText = `font-size: 20px; background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.4); border: 2px solid ${borderColor}; line-height: 1; cursor: pointer;`;
                content.innerHTML = '🚻';
                
                // 마커 클릭 시 상세정보 팝업 연결
                content.onclick = function() { 
                    showToiletInfo(t); 
                };

                // 카카오맵 CustomOverlay를 사용하여 생성한 DOM 엘리먼트 배치
                let marker = new kakao.maps.CustomOverlay({
                    map: map, 
                    position: new kakao.maps.LatLng(t.lat, t.lng),
                    content: content,
                    yAnchor: 1
                });
                
                markers.push(marker);
            });
        }

        function searchToilet() {
            let keyword = document.getElementById('searchInput').value.trim();
            
            if (!keyword) {
                alert("검색어를 입력해주세요.");
                return;
            }

            if (!allToiletsData || allToiletsData.length === 0) {
                alert("아직 데이터를 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
                return;
            }

            let found = allToiletsData.find(t => 
                (t.name && t.name.toLowerCase().includes(keyword.toLowerCase())) || 
                (t.workplace && t.workplace.toLowerCase().includes(keyword.toLowerCase()))
            );

            if (found) {
                let targetLoc = new kakao.maps.LatLng(found.lat, found.lng);
                
                map.setCenter(targetLoc); 
                map.setLevel(3);    
                
                showToiletInfo(found); 

                if (highlightOverlay) { highlightOverlay.setMap(null); } 
                
                let highlightContent = '<div class="pulse-marker"></div>';
                highlightOverlay = new kakao.maps.CustomOverlay({
                    map: map,
                    position: targetLoc,
                    content: highlightContent,
                    xAnchor: 0.5,
                    yAnchor: 1.0, 
                    zIndex: 1
                });

                setTimeout(() => {
                    if (highlightOverlay) { highlightOverlay.setMap(null); }
                }, 3000);

            } else {
                alert("일치하는 화장실이나 근무장소가 없습니다.");
            }
        }

        function showToiletInfo(data) {
            let badgeClass = data.type.includes('경찰') ? 'badge-police' : 'badge-public';
            let imagesHtml = '';
            
            if(data.images && data.images.length > 0) {
                imagesHtml = `<div class="image-carousel">`;
                data.images.forEach(img => { 
                    let finalSrc = img;
                    let match = img.match(/id=([a-zA-Z0-9_-]+)/);
                    if (match && match[1]) finalSrc = `https://lh3.googleusercontent.com/d/${match[1]}`;
                    
                    imagesHtml += `<img src="${finalSrc}" alt="화장실사진" onclick="openZoom(this.src)" onerror="this.src='https://via.placeholder.com/150?text=Image+Error';">`; 
                });
                imagesHtml += `</div><p style="font-size:11px; color:gray; margin-top:0;">좌우로 스크롤 가능 / 사진 터치 시 확대</p>`;
            }

            let html = `
                <span class="close-btn" onclick="document.getElementById('infoModal').style.display='none'">&times;</span>
                <div class="info-title">
                    <div class="info-workplace">🏢 근무장소: ${data.workplace || '미지정'}</div>
                    ${data.name}
                </div>
                <div class="badge ${badgeClass}">${data.type}</div>
                <div class="info-row">📍 <b>주소:</b> ${data.address || '정보없음'}</div>
                <div class="info-row">🕒 <b>운영시간:</b> ${data.hours || '정보없음'}</div>
                <div class="info-row">🔑 <b>비밀번호:</b> <span style="color:red; font-weight:bold;">${data.password || '없음(개방)'}</span></div>
                <div class="info-row">🚽 <b>시설:</b> ${data.bidet} / 대변기 ${data.toiletCnt || 0}개 / 소변기 ${data.urinalCnt || 0}개</div>
                ${imagesHtml}
            `;
            document.getElementById('infoContent').innerHTML = html;
            document.getElementById('infoModal').style.display = 'block';
        }

        function openZoom(src) {
            document.getElementById('zoomImage').src = src;
            document.getElementById('imageZoomModal').style.display = 'flex'; 
        }
        
        function closeZoom() {
            document.getElementById('imageZoomModal').style.display = 'none';
        }

        function fetchAddressFromMarker() {
            if (!registerMarker) return alert("지정된 핀이 없습니다.");
            let loc = registerMarker.getPosition();
            
            geocoder.coord2Address(loc.getLng(), loc.getLat(), function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    let detailAddr = !!result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
                    document.getElementById('regAddress').value = detailAddr;
                } else {
                    alert("해당 위치의 주소를 찾을 수 없습니다. 직접 입력해주세요.");
                    document.getElementById('regAddress').value = '';
                }
            });
        }

        function setLoggedInUI(id) {
            loggedInUser = id;
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('btn-logout').style.display = 'block';
            document.getElementById('btn-sync').style.display = 'block'; 
            
            let adminBtn = document.getElementById('btn-admin');
            adminBtn.innerText = "➕ 새 화장실 등록";
            adminBtn.style.background = "#d32f2f";
            
            adminBtn.onclick = function() { 
                isRegisterMode = true;
                if(registerMarker) registerMarker.setMap(null); 
                alert("📍 지도 위에서 화장실이 위치한 곳을 '터치(클릭)' 하세요.");
            };
        }

        function checkLoginStatus() {
            let savedId = sessionStorage.getItem('adminId');
            if(savedId) setLoggedInUI(savedId);
        }

        function logout() {
            sessionStorage.removeItem('adminId');
            alert("로그아웃 되었습니다.");
            window.location.reload();
        }

        async function login() {
            let id = document.getElementById('adminId').value;
            let pw = document.getElementById('adminPw').value;
            
            let btn = document.querySelector('#loginModal .submit-btn');
            btn.innerText = "로그인 중...";

            try {
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', id: id, pw: pw }),
                    redirect: 'follow'
                });
                
                let result = await response.json();
                if(result.success) {
                    alert(`${result.name}님 환영합니다.`);
                    sessionStorage.setItem('adminId', id); 
                    setLoggedInUI(id);
                } else {
                    alert(result.message);
                }
            } catch(e) { 
                alert("통신 오류가 발생했습니다."); 
            }
            btn.innerText = "로그인";
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const MAX_WIDTH = 800; const MAX_HEIGHT = 800; 
                        let width = img.width; let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height = Math.round(height * (MAX_WIDTH / width)); width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width = Math.round(width * (MAX_HEIGHT / height)); height = MAX_HEIGHT; }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        async function registerToilet() {
            let workplace = document.getElementById('regWorkplace').value;
            let name = document.getElementById('regName').value;
            
            if(!workplace) return alert("근무장소를 입력하거나 선택해주세요.");
            if(!name) return alert("화장실 이름을 입력해주세요.");

            let btn = document.querySelector('#registerModal .submit-btn');
            btn.innerText = "업로드 중... (압축 적용됨)";
            btn.disabled = true;

            let position = registerMarker.getPosition();
            
            let files = [];
            let file1 = document.getElementById('regImage1').files[0];
            let file2 = document.getElementById('regImage2').files[0];
            
            if (file1) files.push(file1);
            if (file2) files.push(file2);
            
            let base64Images = [];
            for(let i=0; i<files.length; i++) {
                let b64 = await compressImage(files[i]);
                base64Images.push(b64);
            }

            let payload = {
                action: 'register', 
                userId: loggedInUser, 
                workplace: workplace, 
                name: name, 
                address: document.getElementById('regAddress').value,
                lat: position.getLat(), lng: position.getLng(), 
                type: document.getElementById('regType').value,
                password: document.getElementById('regPassword').value, 
                hours: document.getElementById('regHours').value,
                bidet: document.getElementById('regBidet').value, 
                toiletCnt: document.getElementById('regToilet').value,
                urinalCnt: document.getElementById('regUrinal').value, 
                images: base64Images
            };

            try {
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload), redirect: 'follow'
                });
                let result = await response.json();
                if(result.success) {
                    alert("성공적으로 등록되었습니다!\n데이터를 실시간으로 확인하시려면 '수동 업데이트' 버튼을 클릭해 주세요.");
                    document.getElementById('registerModal').style.display = 'none';
                    fetchLiveData(); 
                } else {
                    alert("오류: " + result.message);
                }
            } catch(e) { 
                alert("등록 실패. 다시 시도해주세요."); 
            }
            
            btn.innerText = "등록하기";
            btn.disabled = false;
        }
    </script>
