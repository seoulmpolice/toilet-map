<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pol-Toilet: 기동대 안심 화장실 지도</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    /* 모달 UI 스타일 */
    .modal { 
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: white; padding: 20px; z-index: 1000; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
      width: 320px; max-height: 80vh; overflow-y: auto;
    }
    .overlay { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.5); z-index: 999; 
    }
    .modal h4 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .modal .close-btn { cursor: pointer; font-size: 20px; font-weight: bold; color: #999; }
    
    .modal label { font-size: 0.85em; font-weight: bold; color: #333; margin-top: 10px; display: block; }
    .modal input[type="text"], .modal input[type="password"], .modal input[type="number"], .modal select { 
      width: 100%; margin-top: 5px; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
    }
    .btn-group { text-align: right; margin-top: 15px; }
    .btn-group button { padding: 8px 16px; margin-left: 5px; cursor: pointer; background-color: #00467F; color: white; border: none; border-radius: 4px; }
    .btn-group button:disabled { background-color: #aaa; cursor: not-allowed; }
    .info-text { font-size: 0.85em; color: #d9534f; margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 카카오 맵 컨테이너 -->
  <div id="map"></div>
  
  <div class="overlay" id="overlay"></div>
  
  <!-- 관리자 로그인 UI -->
  <div class="modal" id="loginModal">
    <h4>관리자 로그인 <span class="close-btn" onclick="closeModal('loginModal')">&times;</span></h4>
    <input type="text" id="adminId" placeholder="아이디">
    <input type="password" id="adminPw" placeholder="비밀번호">
    <div class="btn-group">
      <button id="loginBtn" onclick="processLogin()">로그인</button>
    </div>
  </div>

  <!-- 신규 화장실 등록 UI -->
  <div class="modal" id="registerModal">
    <h4>신규 화장실 등록 <span class="close-btn" onclick="closeModal('registerModal')">&times;</span></h4>
    <p class="info-text">※ 클릭하신 위치로 화장실이 등록됩니다.</p>
    
    <label>화장실 이름</label>
    <input type="text" id="tName" placeholder="예: 광화문역 1번출구 공중화장실">
    
    <label>상세 주소</label>
    <input type="text" id="tAddress" placeholder="주소 입력">
    
    <label>화장실 성격 구분</label>
    <select id="tType">
        <option value="경찰 전용/협조">경찰 전용/협조 화장실</option>
        <option value="일반 공공개방">일반 공공개방 화장실</option>
    </select>
    
    <label>출입 비밀번호 (개방형이면 빈칸)</label>
    <input type="text" id="tPassword" placeholder="비밀번호">
    
    <label>운영 시간</label>
    <input type="text" id="tHours" placeholder="예: 24시간, 09:00~18:00">
    
    <label>비데 설치 여부</label>
    <select id="tBidet">
        <option value="알수없음">알 수 없음</option>
        <option value="O">있음 (O)</option>
        <option value="X">없음 (X)</option>
    </select>
    
    <label>대/소변기 갯수</label>
    <div style="display: flex; gap: 10px;">
        <input type="number" id="tToiletCnt" placeholder="대변기 수" min="0">
        <input type="number" id="tUrinalCnt" placeholder="소변기 수" min="0">
    </div>

    <label>현장 사진 첨부 (최대 2장)</label>
    <input type="file" id="tImage1" accept="image/*" style="margin-bottom: 5px;">
    <input type="file" id="tImage2" accept="image/*">
    
    <div class="btn-group">
      <button onclick="submitToilet()" id="submitBtn">등록하기</button>
    </div>
  </div>

  <!-- 카카오 지도 API (App Key를 반드시 본인 것으로 변경하세요) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=본인의_카카오_앱_키_입력"></script>
  
  <script>
    // 배포해주신 최신 GAS 웹앱 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzDTe5IrmjMdD0IoURXiI2wMwsiPJhTlE_ppdUyqnK1kUDKQP8zHY6E2uGdtE3rN9HJXA/exec";
    
    // 1. 지도 초기화
    const mapContainer = document.getElementById('map'); 
    const mapOption = { 
        center: new kakao.maps.LatLng(37.566826, 126.9786567), // 서울시청 기본 좌표
        level: 4 
    };
    const map = new kakao.maps.Map(mapContainer, mapOption);
    
    let isAdmin = false; 
    let loggedInUserId = ""; // 등록 시 시트에 기록할 로그인 아이디
    let selectedLatLng = null; 

    // 2. 정적 JSON 파일 데이터 로드 (GitHub Actions 배포 방식)
    function loadToiletData() {
      fetch('./data/toilets.json') 
        .then(response => {
          if (!response.ok) throw new Error("JSON 데이터를 불러오는 중입니다. (Actions 배포 대기 중이거나 경로 오류)");
          return response.json();
        })
        .then(data => {
          // Apps Script의 doGet에서 응답하는 { success: true, data: [...] } 구조 처리
          if(data && data.success && data.data) {
            data.data.forEach(toilet => {
              const markerPosition = new kakao.maps.LatLng(toilet.lat, toilet.lng);
              const marker = new kakao.maps.Marker({ position: markerPosition });
              marker.setMap(map);
              
              // 마커 클릭 시 임시 알림 (추후 인포윈도우 디자인 가능)
              kakao.maps.event.addListener(marker, 'click', function() {
                alert(`[${toilet.type}] ${toilet.name}\n주소: ${toilet.address || '정보 없음'}`);
              });
            });
          }
        })
        .catch(error => console.warn(error.message));
    }

    // 3. 지도 클릭 이벤트 (신규 등록)
    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
      if (!isAdmin) {
        openModal('loginModal'); 
        return;
      }
      selectedLatLng = mouseEvent.latLng;
      openModal('registerModal');
    });

    // 4. 모달 제어 함수
    function openModal(id) {
      document.getElementById('overlay').style.display = 'block';
      document.getElementById(id).style.display = 'block';
    }
    function closeModal(id) {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById(id).style.display = 'none';
    }

    // 5. 서버 연동 관리자 로그인 처리
    function processLogin() {
      const id = document.getElementById('adminId').value;
      const pw = document.getElementById('adminPw').value;
      
      if(!id || !pw) { alert("아이디와 비밀번호를 입력해주세요."); return; }
      
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.innerText = "로그인 중...";
      loginBtn.disabled = true;

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', id: id, pw: pw })
      })
      .then(res => res.json())
      .then(data => {
        loginBtn.innerText = "로그인";
        loginBtn.disabled = false;
        
        if(data.success) {
          isAdmin = true;
          loggedInUserId = id;
          alert(`${data.name} 관리자님 환영합니다.\n지도 빈 공간을 클릭하여 화장실을 등록하세요.`);
          closeModal('loginModal');
        } else {
          alert(data.message);
        }
      })
      .catch(err => {
        loginBtn.innerText = "로그인";
        loginBtn.disabled = false;
        alert("로그인 통신 실패. 네트워크 상태를 확인해주세요.");
      });
    }

    // 6. 비동기 이미지 압축(리사이즈) 함수 (Promise 적용)
    function compressImage(file) {
      return new Promise((resolve) => {
        if (!file) { resolve(""); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800; // 가로 800px 최적화
            
            let width = img.width;
            let height = img.height;
            
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
            
            canvas.width = width;
            canvas.height = height;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            resolve(canvas.toDataURL('image/jpeg', 0.7)); // 70% 화질의 base64 반환
          }
          img.src = e.target.result;
        }
        reader.readAsDataURL(file);
      });
    }

    // 7. 신규 화장실 데이터 서버로 전송
    async function submitToilet() {
      const name = document.getElementById('tName').value;
      
      if(!name) { alert("화장실 이름을 입력하세요."); return; }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "이미지 압축 및 등록 중...";
      submitBtn.disabled = true;

      // 두 이미지를 순차적으로 압축
      const base64_1 = await compressImage(document.getElementById('tImage1').files[0]);
      const base64_2 = await compressImage(document.getElementById('tImage2').files[0]);
      
      // 압축된 이미지만 배열에 담기
      const imagesArray = [];
      if(base64_1) imagesArray.push(base64_1);
      if(base64_2) imagesArray.push(base64_2);

      // Apps Script의 action: 'register' 구조에 맞춘 페이로드
      const payload = {
        action: 'register',
        userId: loggedInUserId,
        name: name,
        address: document.getElementById('tAddress').value,
        lat: selectedLatLng.getLat(),
        lng: selectedLatLng.getLng(),
        type: document.getElementById('tType').value,
        password: document.getElementById('tPassword').value,
        hours: document.getElementById('tHours').value,
        bidet: document.getElementById('tBidet').value,
        toiletCnt: document.getElementById('tToiletCnt').value,
        urinalCnt: document.getElementById('tUrinalCnt').value,
        images: imagesArray
      };

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        submitBtn.innerText = "등록하기";
        submitBtn.disabled = false;
        
        if(data.success) {
          alert("성공적으로 등록되었습니다.\nGitHub Actions 동기화 후 정적 지도에 반영됩니다.");
          closeModal('registerModal');
          
          // 입력창 초기화 (선택사항)
          document.querySelectorAll('#registerModal input').forEach(input => {
            if(input.type === 'text' || input.type === 'number') input.value = '';
            if(input.type === 'file') input.value = '';
          });
        } else {
          alert("오류 발생: " + data.message);
        }
      })
      .catch(err => {
        submitBtn.innerText = "등록하기";
        submitBtn.disabled = false;
        alert("전송 실패: 서버 통신을 확인해주세요.");
      });
    }

    // 앱 시작 시 정적 JSON 데이터 로드 실행
    window.onload = loadToiletData;
  </script>
</body>
</html>
