<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울경찰 기동대 화장실 지도</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f4; }
        #map { width: 100%; height: 100vh; }
        
        /* 1. 최상단 검색창 (모바일 좌우 꽉 차게) */
        #search-box {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px; /* 좌우 여백 동일하게 주어 꽉 차게 만듦 */
            z-index: 10;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
        }
        #searchInput { 
            flex: 1; margin: 0; padding: 12px 15px; border: 1px solid #ddd; 
            border-radius: 8px; font-size: 15px; background: #f9f9f9; outline: none; 
        }
        #searchInput:focus { border-color: #003478; background: white; }
        #search-box button { 
            width: auto; background: #003478; color: white; border: none; 
            padding: 0 18px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; 
        }

        /* 2. 하단 고정 버튼 바 (내 위치 + 화장실 등록 좌우 배치) */
        #bottom-bar {
            position: absolute;
            bottom: 30px;
            left: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            gap: 12px; /* 버튼 사이 간격 */
        }
        #bottom-bar button {
            flex: 1; /* 두 버튼이 화면을 반반씩 차지하도록 설정 */
            padding: 16px 10px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        #btn-myloc { background: #2e7d32; color: white; } /* 녹색 */
        #btn-admin { background: #003478; color: white; } /* 파란색 */

        /* 관리자 로그인 후 우측 상단 기능 버튼들 */
        #admin-panel {
            position: absolute;
            top: 85px;
            right: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #admin-panel button {
            background: white; padding: 10px 14px; border-radius: 8px; border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-weight: bold; font-size: 13px; cursor: pointer; display: none;
        }
        #btn-sync { color: #2e7d32; }
        #btn-logout { color: #d32f2f; }

        /* 모달 및 폼 공통 스타일 (심플/둥글게 개선) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 20; }
        .modal-content { 
            background: white; width: 90%; max-width: 400px; margin: auto; position: relative; 
            top: 50%; transform: translateY(-50%); padding: 25px; border-radius: 16px; 
            max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; color: #888; }
        
        input, select { 
            width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #ddd; 
            border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; background: #f9f9f9;
        }
        input:focus, select:focus { border-color: #003478; background: white; }
        .submit-btn { background: #003478; color: white; border: none; font-weight: bold; font-size: 16px; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }

        /* 화장실 상세 정보 모달 */
        #imageZoomModal { z-index: 9999; background: rgba(0,0,0,0.8); cursor: pointer; display: none; align-items: center; justify-content: center; }
        #zoomImage { max-width: 95%; max-height: 95%; object-fit: contain; }
        .info-title { font-size: 20px; font-weight: bold; color: #003478; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info-row { margin-bottom: 8px; font-size: 14px; color: #333; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; color: white; margin-bottom: 15px;}
        .badge-police { background: #d32f2f; }
        .badge-public { background: #1976d2; }
        .image-carousel { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; }
        .image-carousel img { height: 160px; border-radius: 8px; flex-shrink: 0; object-fit: cover; cursor: pointer; border: 1px solid #eee; }
    </style>
    <!-- 카카오맵 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f582c575c24af8ac06bccb60370ae130&libraries=services"></script>
</head>
<body>

    <div id="map"></div>
    
    <!-- 최상단 키워드 검색창 -->
    <div id="search-box">
        <input type="text" id="searchInput" placeholder="근무장소 또는 화장실 이름 검색" onkeypress="if(event.key === 'Enter' || event.keyCode === 13) searchToilet()">
        <button onclick="searchToilet()">검색</button>
    </div>

    <!-- 우측 상단 숨김 메뉴 (로그인 시 노출) -->
    <div id="admin-panel">
        <button id="btn-sync" onclick="fetchLiveData()">🔄 데이터 실시간 업데이트</button>
        <button id="btn-logout" onclick="logout()">로그아웃</button>
    </div>

    <!-- 하단 고정 UI 바 (모바일 친화적) -->
    <div id="bottom-bar">
        <button id="btn-myloc" onclick="moveToMyLocation()">📍 내 위치</button>
        <button id="btn-admin" onclick="document.getElementById('loginModal').style.display='block'">➕ 화장실 등록</button>
    </div>

    <!-- 1. 로그인 모달 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('loginModal').style.display='none'">&times;</span>
            <h2 style="color:#003478; margin-top:0; font-size: 18px;">관리자 로그인</h2>
            <input type="text" id="adminId" placeholder="아이디">
            <input type="password" id="adminPw" placeholder="비밀번호">
            <button class="submit-btn" onclick="login()">로그인</button>
        </div>
    </div>

    <!-- 2. 화장실 등록 모달 -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('registerModal').style.display='none'">&times;</span>
            <h2 style="color:#003478; margin-top:0; font-size: 18px;">신규 화장실 등록</h2>
            <p style="font-size: 12px; color: #d32f2f; font-weight: bold; margin-bottom: 20px;">※ 지도에서 클릭하신 위치로 등록됩니다.</p>
            
            <label style="font-size: 13px; font-weight:bold; color: #555;">근무장소 (목록 선택 또는 직접 입력)</label>
            <input type="text" id="regWorkplace" list="workplaceList" placeholder="예: 광화문 광장" autocomplete="off" required>
            <datalist id="workplaceList"></datalist>

            <label style="font-size: 13px; font-weight:bold; color: #555;">화장실 이름</label>
            <input type="text" id="regName" placeholder="예: OO빌딩 1층" required>
            
            <div style="display:flex; gap:8px; align-items:center; margin: 0 0 16px 0;">
                <input type="text" id="regAddress" placeholder="대략적인 주소" style="flex:1; margin:0;">
                <button type="button" onclick="fetchAddressFromMarker()" style="width:auto; padding:12px 15px; background:#555; color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:bold; white-space:nowrap; margin:0;">주소 가져오기</button>
            </div>

            <select id="regType">
                <option value="경찰전용/협조">경찰전용/협조 화장실</option>
                <option value="공공개방">일반 공공개방 화장실</option>
            </select>
            <input type="text" id="regPassword" placeholder="비밀번호 (없으면 공란)">
            <input type="text" id="regHours" placeholder="운영시간 (예: 24시간, 09:00~18:00)">
            <select id="regBidet">
                <option value="비데 모름/없음">비데 유무 선택</option>
                <option value="비데 있음">비데 있음 (O)</option>
                <option value="비데 없음">비데 없음 (X)</option>
            </select>
            <div style="display:flex; gap:10px; margin-bottom: 16px;">
                <input type="number" id="regToilet" placeholder="대변기 수" style="margin:0;">
                <input type="number" id="regUrinal" placeholder="소변기 수" style="margin:0;">
            </div>
            
            <label style="font-size: 13px; font-weight:bold; color: #555;">현장 사진 첨부 1 (자동 압축)</label>
            <input type="file" id="regImage1" accept="image/*" style="padding: 5px;">
            
            <label style="font-size: 13px; font-weight:bold; color: #555;">현장 사진 첨부 2 (자동 압축)</label>
            <input type="file" id="regImage2" accept="image/*" style="padding: 5px;">
            
            <button class="submit-btn" onclick="registerToilet()">완료 및 등록하기</button>
        </div>
    </div>

    <!-- 3. 상세정보 모달 -->
    <div id="infoModal" class="modal">
        <div class="modal-content" id="infoContent"></div>
    </div>

    <!-- 4. 사진 확대 모달 -->
    <div id="imageZoomModal" class="modal" onclick="closeZoom()">
        <img id="zoomImage" src="" alt="확대된 사진">
    </div>

    <script>
        // 최신 Web App URL 적용
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzDTe5IrmjMdD0IoURXiI2wMwsiPJhTlE_ppdUyqnK1kUDKQP8zHY6E2uGdtE3rN9HJXA/exec'; 
        
        let map;
        let loggedInUser = null;
        let toiletsData = [];
        let registerMarker = null; 
        let isRegisterMode = false;
        let geocoder; 

        // 1. 지도 초기화 및 로그인 상태 체크
        window.onload = function() {
            let container = document.getElementById('map');
            let options = { center: new kakao.maps.LatLng(37.566826, 126.9786567), level: 4 }; 
            map = new kakao.maps.Map(container, options);
            
            geocoder = new kakao.maps.services.Geocoder();

            // 등록 모드일 때 지도 클릭 시 핀 꽂기 이벤트
            kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                if (isRegisterMode) {
                    let loc = mouseEvent.latLng;
                    if (!registerMarker) {
                        registerMarker = new kakao.maps.Marker({ map: map, position: loc, draggable: true });
                    } else {
                        registerMarker.setPosition(loc);
                        registerMarker.setMap(map);
                    }
                    
                    document.getElementById('regAddress').value = '';
                    isRegisterMode = false;
                    document.getElementById('registerModal').style.display = 'block';
                }
            });

            moveToMyLocation();
            loadToilets();
            checkLoginStatus(); 
        };

        // 내 위치로 이동 (경찰관 아이콘 없이 화면만 이동)
        function moveToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    let locPosition = new kakao.maps.LatLng(lat, lon);
                    map.setCenter(locPosition);
                });
            } else {
                alert("GPS를 지원하지 않는 기기입니다.");
            }
        }

        // 화장실 데이터 불러오기
        async function loadToilets() {
            try {
                let response = await fetch('./data/toilets.json');
                if (!response.ok) throw new Error("정적 JSON 파일 없음");
                let result = await response.json();
                
                let dataArray = result.data ? result.data : result;
                if(dataArray) {
                    toiletsData = dataArray;
                    renderMarkers(toiletsData);
                }
            } catch(e) { 
                console.log("정적 파일 로드 실패, 실시간 API로 대체:", e);
                loadToiletsFromAPI();
            }
        }

        async function loadToiletsFromAPI() {
            try {
                let response = await fetch(SCRIPT_URL, { redirect: 'follow' });
                let result = await response.json();
                if(result.success) {
                    toiletsData = result.data;
                    renderMarkers(toiletsData);
                }
            } catch(e) { console.log("API 데이터 로드 실패:", e); }
        }

        // 마커(기존 카카오 기본 핀) 렌더링 및 클릭 이벤트
        let markers = [];
        function renderMarkers(dataArray) {
            markers.forEach(m => m.setMap(null));
            markers = [];

            // 셀렉트 박스(목록) 자동완성용 데이터 채우기
            const fetchedWorkplaces = toiletsData.map(t => t.workplace).filter(Boolean);
            const combinedWorkplaces = [...new Set(fetchedWorkplaces)];
            const dataList = document.getElementById('workplaceList');
            dataList.innerHTML = combinedWorkplaces.map(wp => `<option value="${wp}">`).join('');

            dataArray.forEach(t => {
                let marker = new kakao.maps.Marker({
                    map: map, position: new kakao.maps.LatLng(t.lat, t.lng)
                });
                kakao.maps.event.addListener(marker, 'click', function() { showToiletInfo(t); });
                markers.push(marker);
            });
        }

        // 키워드 검색 기능 
        function searchToilet() {
            let keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                renderMarkers(toiletsData); // 빈칸 검색 시 전체 마커 복구
                return;
            }

            let filtered = toiletsData.filter(t => 
                (t.name && t.name.toLowerCase().includes(keyword.toLowerCase())) ||
                (t.workplace && t.workplace.toLowerCase().includes(keyword.toLowerCase()))
            );

            if (filtered.length > 0) {
                renderMarkers(filtered);
                let bounds = new kakao.maps.LatLngBounds();
                filtered.forEach(t => bounds.extend(new kakao.maps.LatLng(t.lat, t.lng)));
                map.setBounds(bounds);
                
                // 한 개만 검색되었을 경우 팝업 즉시 오픈
                if(filtered.length === 1) showToiletInfo(filtered[0]);
            } else {
                alert("일치하는 화장실이나 근무장소를 찾을 수 없습니다.");
                renderMarkers(toiletsData);
            }
        }

        // 상세 정보 팝업 표시
        function showToiletInfo(data) {
            let badgeClass = data.type && data.type.includes('경찰') ? 'badge-police' : 'badge-public';
            let imagesHtml = '';
            
            if(data.images && data.images.length > 0) {
                imagesHtml = `<div class="image-carousel">`;
                data.images.forEach(img => { 
                    let finalSrc = img;
                    let match = img.match(/id=([a-zA-Z0-9_-]+)/);
                    if (match && match[1]) {
                        finalSrc = `https://lh3.googleusercontent.com/d/${match[1]}`;
                    }
                    imagesHtml += `<img src="${finalSrc}" alt="화장실사진" onclick="openZoom(this.src)" onerror="this.src='https://via.placeholder.com/150?text=Image+Error';">`; 
                });
                imagesHtml += `</div><p style="font-size:11px; color:#888; margin-top:0;">좌우로 스크롤 가능 / 사진 터치 시 확대</p>`;
            }

            let html = `
                <span class="close-btn" onclick="document.getElementById('infoModal').style.display='none'">&times;</span>
                <div class="info-title">
                    <div style="font-size: 13px; color: #666; margin-bottom: 5px; font-weight: normal;">🏢 근무장소: ${data.workplace || '미지정'}</div>
                    ${data.name}
                </div>
                <div class="badge ${badgeClass}">${data.type || '일반'}</div>
                <div class="info-row">📍 <b>주소:</b> ${data.address || '정보없음'}</div>
                <div class="info-row">🕒 <b>운영시간:</b> ${data.hours || '정보없음'}</div>
                <div class="info-row">🔑 <b>비밀번호:</b> <span style="color:red; font-weight:bold;">${data.password || '없음(개방)'}</span></div>
                <div class="info-row">🚽 <b>시설:</b> ${data.bidet || '정보없음'} / 대변기 ${data.toiletCnt || 0}개 / 소변기 ${data.urinalCnt || 0}개</div>
                ${imagesHtml}
            `;
            document.getElementById('infoContent').innerHTML = html;
            document.getElementById('infoModal').style.display = 'block';
        }

        // 사진 확대 팝업 제어
        function openZoom(src) {
            document.getElementById('zoomImage').src = src;
            document.getElementById('imageZoomModal').style.display = 'flex'; 
        }
        
        function closeZoom() {
            document.getElementById('imageZoomModal').style.display = 'none';
        }

        // 주소 가져오기 버튼 동작
        function fetchAddressFromMarker() {
            if (!registerMarker) {
                alert("지정된 핀이 없습니다.");
                return;
            }
            let loc = registerMarker.getPosition();
            
            geocoder.coord2Address(loc.getLng(), loc.getLat(), function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    let detailAddr = !!result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
                    document.getElementById('regAddress').value = detailAddr;
                } else {
                    alert("해당 위치의 주소를 찾을 수 없습니다. 직접 입력해주세요.");
                    document.getElementById('regAddress').value = '';
                }
            });
        }

        // 로그인 유지 및 세팅 처리
        function setLoggedInUI(id) {
            loggedInUser = id;
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('btn-logout').style.display = 'block';
            document.getElementById('btn-sync').style.display = 'block';
            
            let adminBtn = document.getElementById('btn-admin');
            adminBtn.innerText = "➕ 새 화장실 등록";
            adminBtn.style.background = "#d32f2f"; // 등록 모드 시 빨간색으로 변경
            
            adminBtn.onclick = function() { 
                isRegisterMode = true;
                if(registerMarker) registerMarker.setMap(null); 
                alert("📍 지도 위에서 화장실이 위치한 곳을 '터치(클릭)' 하세요.");
            };
        }

        function checkLoginStatus() {
            let savedId = sessionStorage.getItem('adminId');
            if(savedId) setLoggedInUI(savedId);
        }

        function logout() {
            sessionStorage.removeItem('adminId');
            alert("로그아웃 되었습니다.");
            window.location.reload();
        }

        // 관리자 로그인 서버 통신
        async function login() {
            let id = document.getElementById('adminId').value;
            let pw = document.getElementById('adminPw').value;
            
            let btn = document.querySelector('#loginModal .submit-btn');
            btn.innerText = "로그인 중...";

            try {
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', id: id, pw: pw }),
                    redirect: 'follow'
                });
                
                let result = await response.json();
                if(result.success) {
                    alert(`${result.name}님 환영합니다.`);
                    sessionStorage.setItem('adminId', id); 
                    setLoggedInUI(id);
                } else {
                    alert(result.message);
                }
            } catch(e) { 
                console.error(e);
                alert("통신 오류가 발생했습니다."); 
            }
            btn.innerText = "로그인";
        }

        // 데이터 수동 동기화 
        async function fetchLiveData() {
            const syncBtn = document.getElementById('btn-sync');
            syncBtn.innerText = "⏳ 갱신 중...";
            try {
                let response = await fetch(SCRIPT_URL, { redirect: 'follow' });
                let result = await response.json();
                if(result.success) {
                    toiletsData = result.data; 
                    renderMarkers(toiletsData);
                    alert("실시간으로 최신 데이터가 반영되었습니다.");
                }
            } catch(e) {
                alert("데이터를 갱신하는데 실패했습니다.");
            }
            syncBtn.innerText = "🔄 데이터 실시간 업데이트";
        }

        // 이미지 압축 및 JPEG 변환
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const MAX_WIDTH = 800; 
                        const MAX_HEIGHT = 800; 
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height = Math.round(height * (MAX_WIDTH / width));
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width = Math.round(width * (MAX_HEIGHT / height));
                                height = MAX_HEIGHT;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(dataUrl);
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        // 신규 화장실 데이터 전송
        async function registerToilet() {
            let workplace = document.getElementById('regWorkplace').value;
            let name = document.getElementById('regName').value;
            
            if(!workplace) return alert("근무장소를 입력하거나 선택해주세요.");
            if(!name) return alert("화장실 이름을 입력해주세요.");

            let btn = document.querySelector('#registerModal .submit-btn');
            btn.innerText = "업로드 중... (압축 적용됨)";
            btn.disabled = true;

            let position = registerMarker.getPosition();
            
            let files = [];
            let file1 = document.getElementById('regImage1').files[0];
            let file2 = document.getElementById('regImage2').files[0];
            
            if (file1) files.push(file1);
            if (file2) files.push(file2);
            
            let base64Images = [];
            for(let i=0; i<files.length; i++) {
                let b64 = await compressImage(files[i]);
                base64Images.push(b64);
            }

            let payload = {
                action: 'register', 
                userId: loggedInUser, 
                workplace: workplace, 
                name: name, 
                address: document.getElementById('regAddress').value,
                lat: position.getLat(), 
                lng: position.getLng(), 
                type: document.getElementById('regType').value,
                password: document.getElementById('regPassword').value, 
                hours: document.getElementById('regHours').value,
                bidet: document.getElementById('regBidet').value, 
                toiletCnt: document.getElementById('regToilet').value,
                urinalCnt: document.getElementById('regUrinal').value, 
                images: base64Images
            };

            try {
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    redirect: 'follow'
                });
                let result = await response.json();
                if(result.success) {
                    alert("성공적으로 등록되었습니다!");
                    document.getElementById('registerModal').style.display = 'none';
                    window.location.reload(); 
                } else {
                    alert("오류: " + result.message);
                }
            } catch(e) { 
                console.error(e);
                alert("등록 실패. 다시 시도해주세요."); 
            }
            
            btn.innerText = "완료 및 등록하기";
            btn.disabled = false;
        }
    </script>
