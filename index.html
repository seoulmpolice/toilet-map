    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxc5rNci9m5p_5OZmoCqRsLXlEIwH1SxD-vKc9jPsWsD1JTPRDAuDhJEFA2XsTYGvXHxA/exec'; 
        
        let map, geocoder;
        let loggedInUser = null;
        let registerMarker = null;
        let selectedLatLng = null;
        let currentMode = null; // 'toilet', 'convenience', 'restaurant', 'report'
        let currentFacilityTypeForReport = '';
        let markers = [];
        let allData = { toilets: [], conveniences: [], restaurants: [] };

        const defaultWorkplaces = [
            "송파(올림픽공원)", "미국 대사관", "미국 대사관저", "일본 대사관", 
            "일본 대사관저", "중국 대사관", "중국 대사관저", "이스라엘 대사관", 
            "이스라엘 문화원", "이스라엘 대사관저", "파키스탄 대사관", 
            "정부종합청사", "민생치안 강남", "민생치안", "구로 평강교회", "여의도"
        ];

        window.onload = function() {
            let container = document.getElementById('map');
            map = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(37.566826, 126.9786567), level: 4 });
            geocoder = new kakao.maps.services.Geocoder();

            kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                if (currentMode) {
                    selectedLatLng = mouseEvent.latLng;
                    if (!registerMarker) {
                        registerMarker = new kakao.maps.Marker({ map: map, position: selectedLatLng, draggable: true });
                    } else {
                        registerMarker.setPosition(selectedLatLng);
                        registerMarker.setMap(map);
                    }

                    if (currentMode === 'toilet') openModal('registerToiletModal');
                    else if (currentMode === 'convenience') openModal('registerConvenienceModal');
                    else if (currentMode === 'restaurant') openModal('registerRestaurantModal');
                    else if (currentMode === 'report') openModal('reportFormModal');
                    
                    currentMode = null; // 모드 해제
                }
            });

            moveToMyLocation();
            fetchLiveData();
        };

        function moveToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    map.setCenter(new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude));
                });
            }
        }

        function openModal(id) { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // 관리자 인증 분기
        function openAdminMenu() {
            if (loggedInUser) {
                openModal('adminSelectModal');
            } else {
                openModal('loginModal');
            }
        }

        async function login() {
            let id = document.getElementById('adminId').value;
            let pw = document.getElementById('adminPw').value;
            if(!id || !pw) return alert("아이디와 비밀번호를 입력하세요.");

            try {
                let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', id, pw }) });
                let result = await res.json();
                if(result.success) {
                    loggedInUser = id;
                    alert(`${result.name} 관리자님 환영합니다.`);
                    document.getElementById('btn-logout').style.display = 'block';
                    document.getElementById('btn-sync').style.display = 'block';
                    openModal('adminSelectModal');
                } else {
                    alert(result.message);
                }
            } catch(e) { alert("로그인 통신 실패"); }
        }

        function logout() {
            loggedInUser = null;
            alert("로그아웃 되었습니다.");
            window.location.reload();
        }

        function startRegisterMode(type) {
            closeModal('adminSelectModal');
            currentMode = type;
            if(registerMarker) registerMarker.setMap(null);
            alert("📍 지도에서 등록할 위치를 클릭하세요.");
        }

        // 제보 탭 관련 함수
        function openReportPopup() { openModal('reportInfoModal'); }
        function openReportFormSelect() { openModal('reportSelectModal'); }
        function startReportForm(type) {
            currentFacilityTypeForReport = type;
            document.getElementById('reportFormTitle').innerText = `${type} 직접 제보`;
            closeModal('reportSelectModal');
            currentMode = 'report';
            if(registerMarker) registerMarker.setMap(null);
            alert("📍 지도에서 제보할 시설 위치를 클릭하세요.");
        }

        function fetchAddress(targetInputId) {
            if (!registerMarker) return alert("지정된 핀이 없습니다.");
            let loc = registerMarker.getPosition();
            geocoder.coord2Address(loc.getLng(), loc.getLat(), function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    let addr = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
                    document.getElementById(targetInputId).value = addr;
                } else {
                    alert("주소를 찾지 못했습니다. 직접 입력해 주세요.");
                }
            });
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                if (!file) { resolve(""); return; }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 800) { h *= 800 / w; w = 800; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function fetchLiveData() {
            try {
                let res = await fetch(SCRIPT_URL);
                let result = await res.json();
                if(result.success) {
                    allData = result.data;
                    renderAllMarkers();
                }
            } catch(e) { console.log("데이터 로드 실패", e); }
        }

        function renderAllMarkers() {
            markers.forEach(m => m.setMap(null));
            markers = [];

            let workplaces = [];

            // 1. 화장실 렌더링
            allData.toilets.forEach(t => {
                if(t.workplace) workplaces.push(t.workplace);
                let marker = createMarkerElement(t.lat, t.lng, '🚻', t.cleanliness === '상' ? '#00b0ff' : '#d32f2f', () => showInfo('toilet', t));
                markers.push(marker);
            });

            // 2. 편의점 렌더링
            allData.conveniences.forEach(c => {
                if(c.workplace) workplaces.push(c.workplace);
                let marker = createMarkerElement(c.lat, c.lng, '🏪', '#0288d1', () => showInfo('convenience', c));
                markers.push(marker);
            });

            // 3. 식당 렌더링
            allData.restaurants.forEach(r => {
                if(r.workplace) workplaces.push(r.workplace);
                let marker = createMarkerElement(r.lat, r.lng, '🍽️', '#388e3c', () => showInfo('restaurant', r));
                markers.push(marker);
            });

            // 데이터리스트 갱신
            let combinedWP = [...new Set([...defaultWorkplaces, ...workplaces])];
            document.querySelectorAll('#workplaceList').forEach(dl => {
                dl.innerHTML = combinedWP.map(wp => `<option value="${wp}">`).join('');
            });
        }

        function createMarkerElement(lat, lng, symbol, borderColor, onClickFn) {
            let content = document.createElement('div');
            content.style.cssText = `font-size:20px; background:white; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,0.4); border:3px solid ${borderColor}; cursor:pointer;`;
            content.innerHTML = symbol;
            content.onclick = onClickFn;

            let marker = new kakao.maps.CustomOverlay({ map: map, position: new kakao.maps.LatLng(lat, lng), content: content, yAnchor: 1 });
            return marker;
        }

        // 데이터 등록 공통 함수
        async function submitData(category) {
            let pos = registerMarker.getPosition();
            let payload = { lat: pos.getLat(), lng: pos.getLng() };
            let actionName = '';

            if (category === 'toilet') {
                actionName = 'register_toilet';
                payload.action = actionName;
                payload.userId = loggedInUser;
                payload.workplace = document.getElementById('t_workplace').value;
                payload.name = document.getElementById('t_name').value;
                payload.address = document.getElementById('t_address').value;
                payload.type = document.getElementById('t_type').value;
                payload.cleanliness = document.getElementById('t_cleanliness').value;
                payload.password = document.getElementById('t_password').value;
                payload.hours = document.getElementById('t_hours').value;
                payload.bidet = document.getElementById('t_bidet').value;
                payload.toiletCnt = document.getElementById('t_toilet').value;
                payload.urinalCnt = document.getElementById('t_urinal').value;
                payload.images = [await compressImage(document.getElementById('t_img1').files[0]), await compressImage(document.getElementById('t_img2').files[0])];
            } else if (category === 'convenience') {
                actionName = 'register_convenience';
                payload.action = actionName;
                payload.workplace = document.getElementById('c_workplace').value;
                payload.name = document.getElementById('c_name').value;
                payload.address = document.getElementById('c_address').value;
                payload.hours = document.getElementById('c_hours').value;
                payload.discount = document.getElementById('c_discount').value;
                payload.card = document.getElementById('c_card').value;
                payload.table = document.getElementById('c_table').value;
                payload.notes = document.getElementById('c_notes').value;
                payload.images = [await compressImage(document.getElementById('c_img1').files[0]), await compressImage(document.getElementById('c_img2').files[0])];
            } else if (category === 'restaurant') {
                actionName = 'register_restaurant';
                payload.action = actionName;
                payload.workplace = document.getElementById('r_workplace').value;
                payload.name = document.getElementById('r_name').value;
                payload.address = document.getElementById('r_address').value;
                payload.hours = document.getElementById('r_hours').value;
                payload.breaktime = document.getElementById('r_breaktime').value;
                payload.mealType = document.getElementById('r_mealType').value;
                payload.discount = document.getElementById('r_discount').value;
                payload.group = document.getElementById('r_group').value;
                payload.notes = document.getElementById('r_notes').value;
                payload.images = [await compressImage(document.getElementById('r_img1').files[0]), await compressImage(document.getElementById('r_img2').files[0])];
            }

            sendPostRequest(payload, 'registerToiletModal', 'registerConvenienceModal', 'registerRestaurantModal');
        }

        async function submitReport() {
            let pos = registerMarker.getPosition();
            let payload = {
                action: 'register_report',
                facilityType: currentFacilityTypeForReport,
                reporter: document.getElementById('rep_reporter').value,
                workplace: document.getElementById('rep_workplace').value,
                name: document.getElementById('rep_name').value,
                address: document.getElementById('rep_address').value,
                lat: pos.getLat(),
                lng: pos.getLng(),
                discount: document.getElementById('rep_discount').value,
                hours: document.getElementById('rep_hours').value,
                bidet: document.getElementById('rep_bidet').value,
                space: document.getElementById('rep_space').value,
                images: [await compressImage(document.getElementById('rep_img1').files[0]), await compressImage(document.getElementById('rep_img2').files[0])]
            };
            sendPostRequest(payload, 'reportFormModal');
        }

        async function sendPostRequest(payload, ...modalsToClose) {
            try {
                let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                let result = await res.json();
                if(result.success) {
                    alert("성공적으로 등록(제보)되었습니다!");
                    modalsToClose.forEach(m => closeModal(m));
                    fetchLiveData();
                } else {
                    alert("오류: " + result.message);
                }
            } catch(e) { alert("통신 실패"); }
        }

        function showInfo(category, data) {
            let imgHtml = '';
            if(data.images && data.images.length > 0) {
                imgHtml = `<div class="image-carousel">`;
                data.images.forEach(img => {
                    let match = img.match(/id=([a-zA-Z0-9_-]+)/);
                    let src = match ? `https://lh3.googleusercontent.com/d/${match[1]}` : img;
                    imgHtml += `<img src="${src}" onclick="document.getElementById('zoomImage').src=this.src; document.getElementById('imageZoomModal').style.display='flex';">`;
                });
                imgHtml += `</div>`;
            }

            let badge = '', contentHtml = '';
            if (category === 'toilet') {
                badge = `<span class="badge badge-police">${data.type}</span>`;
                contentHtml = `
                    <div class="info-row">✨ <b>청결도:</b> ${data.cleanliness || '중'}</div>
                    <div class="info-row">🔑 <b>비밀번호:</b> <span style="color:red; font-weight:bold;">${data.password || '개방'}</span></div>
                    <div class="info-row">🕒 <b>운영시간:</b> ${data.hours || '정보없음'}</div>
                    <div class="info-row">🚽 <b>시설:</b> ${data.bidet} / 대변기 ${data.toiletCnt||0}개 / 소변기 ${data.urinalCnt||0}개</div>
                `;
            } else if (category === 'convenience') {
                badge = `<span class="badge badge-cv">편의점</span>`;
                contentHtml = `
                    <div class="info-row">🕒 <b>영업시간:</b> ${data.hours || '정보없음'}</div>
                    <div class="info-row">💰 <b>경찰관 할인:</b> <span style="color:blue; font-weight:bold;">${data.discount || '정보없음'}</span></div>
                    <div class="info-row">💳 <b>추천 제휴카드:</b> ${data.card || '없음'}</div>
                    <div class="info-row">🪑 <b>취식 테이블:</b> ${data.table || '정보없음'}</div>
                    <div class="info-row">📝 <b>특이사항:</b> ${data.notes || '없음'}</div>
                `;
            } else if (category === 'restaurant') {
                badge = `<span class="badge badge-rest">식당</span>`;
                contentHtml = `
                    <div class="info-row">🍲 <b>식사 종류:</b> ${data.mealType || '정보없음'}</div>
                    <div class="info-row">🕒 <b>영업시간:</b> ${data.hours || '정보없음'} (브레이크타임: ${data.breaktime || '없음'})</div>
                    <div class="info-row">💰 <b>경찰관 할인:</b> <span style="color:blue; font-weight:bold;">${data.discount || '정보없음'}</span></div>
                    <div class="info-row">👥 <b>단체 수용:</b> ${data.group || '정보없음'}</div>
                    <div class="info-row">📝 <b>특이사항:</b> ${data.notes || '없음'}</div>
                `;
            }

            let html = `
                <span class="close-btn" onclick="document.getElementById('infoModal').style.display='none'">&times;</span>
                <div class="info-title">
                    <div class="info-workplace">🏢 근무장소: ${data.workplace || '미지정'}</div>
                    ${data.name}
                </div>
                ${badge}
                <div class="info-row">📍 <b>주소:</b> ${data.address || '정보없음'}</div>
                ${contentHtml}
                ${imgHtml}
            `;
            document.getElementById('infoContent').innerHTML = html;
            document.getElementById('infoModal').style.display = 'block';
        }

        function searchFacility() {
            let kw = document.getElementById('searchInput').value.trim().toLowerCase();
            if(!kw) return alert("검색어를 입력하세요.");

            let allList = [...allData.toilets, ...allData.conveniences, ...allData.restaurants];
            let found = allList.find(item => (item.name && item.name.toLowerCase().includes(kw)) || (item.workplace && item.workplace.toLowerCase().includes(kw)));

            if(found) {
                let loc = new kakao.maps.LatLng(found.lat, found.lng);
                map.setCenter(loc);
                map.setLevel(3);
                showInfo(found.category, found);
            } else {
                alert("검색 결과가 없습니다.");
            }
        }
    </script>
