<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화장실 불만 접수 및 시설 점검</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #1a73e8;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: #1a73e8;
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      font-size: 0.9rem;
    }
    .btn-submit {
      width: 100%;
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #1557b0;
    }
    .btn-submit:disabled {
      background-color: #a0c3ff;
      cursor: not-allowed;
    }
    #loading {
      display: none;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #1a73e8;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>화장실 불편사항 접수</h2>
  
  <form id="complaintForm">
    <!-- 위치 선택 -->
    <div class="form-group">
      <label for="location">위치 선택</label>
      <select id="location" name="location" required>
        <option value="">위치를 선택해주세요</option>
        <option value="1층 화장실">1층 화장실</option>
        <option value="2층 화장실">2층 화장실</option>
        <option value="3층 화장실">3층 화장실</option>
        <option value="지하 화장실">지하 화장실</option>
      </select>
    </div>

    <!-- 구분 선택 -->
    <div class="form-group">
      <label for="category">접수 구분</label>
      <select id="category" name="category" required>
        <option value="">구분을 선택해주세요</option>
        <option value="청소 상태 불량">청소 상태 불량</option>
        <option value="휴지/비누 부족">휴지/비누 부족</option>
        <option value="시설물 고장">시설물 고장 (변기, 세면대 등)</option>
        <option value="악취 발생">악취 발생</option>
        <option value="기타">기타</option>
      </select>
    </div>

    <!-- 상세 내용 -->
    <div class="form-group">
      <label for="details">상세 내용</label>
      <textarea id="details" name="details" placeholder="불편한 내용을 입력해주세요." required></textarea>
    </div>

    <!-- 사진 첨부 -->
    <div class="form-group">
      <label for="photo">사진 첨부 (선택)</label>
      <input type="file" id="photo" accept="image/*">
    </div>

    <!-- 제출 버튼 -->
    <button type="submit" class="btn-submit" id="submitBtn">접수하기</button>
  </form>

  <div id="loading">전송 중입니다... 잠시만 기다려주세요.</div>
</div>

<script>
  // 새롭게 업데이트된 Apps Script 웹앱 URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9v7cViN6qh7NsnvjDBBsEXNZ6yk9vw86sU0Dn1AcUAviEXv1vc4tit64u8kPt-eOu4g/exec";

  document.getElementById('complaintForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');

    const location = document.getElementById('location').value;
    const category = document.getElementById('category').value;
    const details = document.getElementById('details').value;
    const fileInput = document.getElementById('photo');

    submitBtn.disabled = true;
    loading.style.display = 'block';

    let fileData = null;

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      fileData = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(',')[1];
          resolve({
            base64: base64,
            mimeType: file.type,
            fileName: file.name
          });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const payload = {
      location: location,
      category: category,
      details: details,
      file: fileData
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === 'success') {
        alert('성공적으로 접수되었습니다. 감사합니다.');
        document.getElementById('complaintForm').reset();
      } else {
        alert('접수 중 오류가 발생했습니다: ' + result.message);
      }
    } catch (error) {
      console.error('Error:', error);
      alert('전송 중 오류가 발생했습니다.');
    } finally {
      submitBtn.disabled = false;
      loading.style.display = 'none';
    }
  });
</script>

</body>
</html>
