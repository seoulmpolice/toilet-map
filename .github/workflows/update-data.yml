name: Update Toilet Data JSON

on:
  schedule:
    # UTC 기준 11:00은 한국 시간(KST)으로 20:00입니다. (매일 20:00 자동 실행)
    - cron: '0 11 * * *' 
  workflow_dispatch: # GitHub 웹사이트에서 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: GAS에서 데이터 가져오기 (JSON 저장)
        run: |
          mkdir -p data
          # 새로 발급받은 Web App URL 적용
          curl -L "https://script.google.com/macros/s/AKfycbzFgfxRpK5dCatdEFaUs7TN2nBsfb34OLhLb7BfzgSQAnIDNvKAYFbRnXDEW50V_s55SQ/exec" -o data/toilets.json

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          git add data/toilets.json
          git commit -m "Auto-update: 화장실 데이터 매일 20시 정기 갱신" || echo "변경된 데이터가 없습니다."
          git push
